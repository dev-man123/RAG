readme = "README.md"
authors = [
    { name = "amit", email = "sharmaamit8091@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "ipykernel>=7.3.0",
    "langchain>=1.3.18",
